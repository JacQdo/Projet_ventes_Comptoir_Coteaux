services:

  postgres:
    image: postgres:17
    container_name: kestra-postgres

    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4

    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 10


  kestra:
    image: kestra/kestra:latest
    container_name: kestra

    user: "0:0"

    command: server standalone

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    volumes:
      - kestra-data:/app/storage
      - kestra-tmp:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
      - "C:/Users/Utilisateur/Documents/courses/Projet_ventes_Comptoir_Coteaux:/project"

    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: k3str4

        kestra:
          server:
            basic-auth:
              username: "jacquessdossou@yahoo.com"
              password: "DOSjrm4@"

          repository:
            type: postgres

          storage:
            type: local
            local:
              base-path: /app/storage

          queue:
            type: postgres

          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp

          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: false


volumes:
  kestra-postgres-data:
  kestra-data:
  kestra-tmp:
