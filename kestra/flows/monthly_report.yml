
id: monthly_sales_report

namespace: ventes.comptoir.coteaux

description: |
  Pipeline mensuel de reporting des ventes du Comptoir Coteaux.

  Kestra orchestre les diffÃ©rentes Ã©tapes du pipeline :
  1. Extraction ERP
  2. Extraction Web
  3. Extraction de la table de liaison
  4. Transformation et calcul des indicateurs
  5. Traitement analytique DuckDB / SQL
  6. GÃ©nÃ©ration des trois livrables commerciaux
  7. VÃ©rification des livrables

tasks:

  - id: pipeline
    type: io.kestra.plugin.core.flow.Dag

    tasks:

      # ==========================================================
      # 1. EXTRACTION ERP
      # ==========================================================
      - task:
          id: extract_erp
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            Extraction, nettoyage et contrÃ´le des donnÃ©es ERP.

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker

          commands:
            - python /app/src/extract/extract_erp.py


      # ==========================================================
      # 2. EXTRACTION WEB
      # ==========================================================
      - task:
          id: extract_web
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            Extraction, nettoyage et contrÃ´le des donnÃ©es Web.

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            version: 2.0.3

          commands:
            - python /app/src/extract/extract_web.py

        dependsOn:
          - extract_erp


      # ==========================================================
      # 3. EXTRACTION LIAISON ERP-WEB
      # ==========================================================
      - task:
          id: extract_liaison
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            Extraction, nettoyage et contrÃ´le de la table
            de liaison ERP-Web.

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - "ventes-coteaux-data:/app"

          commands:
            - python /app/src/extract/extract_liaison.py

        dependsOn:
          - extract_erp


      # ==========================================================
      # 4. TRANSFORMATION
      # ==========================================================
      - task:
          id: transform_sales
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            Jointure ERP / Web / liaison.
            Calcul du chiffre d'affaires.
            Calcul du z-score.
            Classification Premium / Ordinaire.

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - "ventes-coteaux-data:/app"

          commands:
            - python /app/src/transform/transform_sales.py

        dependsOn:
          - extract_web
          - extract_liaison


      # ==========================================================
      # 4 BIS. TRAITEMENT ANALYTIQUE DUCKDB / SQL
      # ==========================================================
      - task:
          id: run_duckdb_sql
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            ExÃ©cution des quatre scripts SQL DuckDB :
            - staging
            - sales mart
            - KPI commerciaux
            - vins Premium

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - "ventes-coteaux-data:/app"

          commands:
            - python -c "import duckdb; con=duckdb.connect('/app/data/processed/sales.duckdb'); con.execute(open('/app/sql/staging/01_staging.sql').read()); con.execute(open('/app/sql/marts/02_sales_mart.sql').read()); con.execute(open('/app/sql/analytics/03_kpi_sales.sql').read()); con.execute(open('/app/sql/analytics/04_premium_wines.sql').read()); print('=== DUCKDB SQL TERMINE ==='); print(con.execute('SELECT * FROM kpi_sales').fetchdf().to_string(index=False)); print('Premium:', con.execute('SELECT COUNT(*) FROM premium_wines').fetchone()[0]); con.close()"

        dependsOn:
          - transform_sales


      # ==========================================================
      # 5. GENERATION DES RAPPORTS
      # ==========================================================
      - task:
          id: generate_reports
          type: io.kestra.plugin.scripts.python.Commands
          pythonVersion: "3.12"

          description: |
            GÃ©nÃ©ration des trois livrables commerciaux :
            - rapport_ca.xlsx
            - vins_premium.csv
            - vins_ordinaires.csv

          containerImage: ventes-coteaux:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - "ventes-coteaux-data:/app"

          commands:
            - python /app/src/reporting/generate_reports.py

        dependsOn:
          - run_duckdb_sql


      # ==========================================================
      # 6. VERIFICATION DES LIVRABLES
      # ==========================================================
      - task:
          id: verify_reports
          type: io.kestra.plugin.scripts.shell.Commands

          description: |
            VÃ©rification de la prÃ©sence des trois livrables gÃ©nÃ©rÃ©s.

          containerImage: alpine:latest

          fileHandlingStrategy: VOLUME
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            volumes:
              - "ventes-coteaux-data:/app"

          commands:
            - test -f /app/data/output/rapport_ca.xlsx
            - test -f /app/data/output/vins_premium.csv
            - test -f /app/data/output/vins_ordinaires.csv
            - echo "=== LIVRABLES PRESENTS ==="
            - ls -lh /app/data/output/

        dependsOn:
          - generate_reports


# ================================================================
# PLANIFICATION MENSUELLE
# ================================================================
triggers:

  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *"
    timezone: Europe/Paris
